name: Build and Deploy to Kubernetes

on:
  push:
    branches:
      - staging  # Trigger workflow เมื่อ push บน branch develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Login to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 3: Build & Push Docker Image
      - name: Build & Push Docker Image
        run: |
          IMAGE_TAG=1.0.${{ github.run_number }}
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          docker build -t ${{ secrets.DOCKER_ACCOUT }}/my-app:$IMAGE_TAG -f ./Dockerfile .
          docker push ${{ secrets.DOCKER_ACCOUT }}/my-app:$IMAGE_TAG

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Step 4: Checkout Helm Chart Repository
      - name: Checkout Helm Chart Repo
        uses: actions/checkout@v3
        with:
          repository: "sompornic/argocd-example-apps"  # เปลี่ยนเป็น repo ของ Helm Chart
          ref: "master"
          token: ${{ secrets.GITHUB_TOKEN }}
          path: helm-node  
          
      - name: Commit & Push
        run: |
          ls -lrt
          pwd

      # Step 5: Update values.yaml เพื่อใช้ Docker Image ใหม่
      - name: Update Helm values.yaml
        run: |
          cd helm-node
          sed -i "s|image: .*|image: ${{ secrets.DOCKER_ACCOUT }}/my-app:$IMAGE_TAG|" values.yaml

      # Step 6: Commit และ Push การเปลี่ยนแปลงใน Helm Chart Repo
      - name: Commit & Push
        run: |
          cd helm-node
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add values.yaml
          git commit -m "Update image to ${{ secrets.DOCKER_ACCOUT }}/my-app:$IMAGE_TAG"
          git push