name: Build and Deploy to Kubernetes
permissions:
  contents: write  # สิทธิ์ในการเขียนไฟล์ (push)
  pull-requests: write  # ถ้าต้องการให้สามารถสร้างและจัดการ pull request

on:
  push:
    branches:
      - staging  # Trigger workflow เมื่อ push บน branch develo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Login to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 3: Build & Push Docker Image
      - name: Build & Push Docker Image
        run: |
          IMAGE_TAG=1.0.${{ github.run_number }}
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          docker build -t ${{ secrets.DOCKER_ACCOUT }}/my-app:$IMAGE_TAG -f ./Dockerfile .
          docker push ${{ secrets.DOCKER_ACCOUT }}/my-app:$IMAGE_TAG

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Step 4: Checkout Helm Chart Repository
      - name: Update Helm values.yaml via GitHub API
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO_OWNER: "sompornic"   # แทนที่ด้วย owner ของ repo เป้าหมาย
          REPO_NAME: "argocd-example-apps"  # ชื่อ repo เป้าหมาย
          FILE_PATH: "helm-node/values.yaml"
          BRANCH: "master"
        run: |
          # ดึง SHA ของไฟล์ปัจจุบัน
          FILE_SHA=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/$REPO_OWNER/$REPO_NAME/contents/$FILE_PATH" | jq -r '.sha')

          # สร้าง JSON Payload สำหรับอัปเดตไฟล์
          PAYLOAD=$(jq -n \
            --arg path "$FILE_PATH" \
            --arg message "Update image to ${{ secrets.DOCKER_ACCOUT }}/my-app:$IMAGE_TAG" \
            --arg content "$(base64 -w 0 helm-node/values.yaml)" \
            --arg sha "$FILE_SHA" \
            '{ path: $path, message: $message, content: $content, sha: $sha }')

          # ส่ง API Request เพื่ออัปเดตไฟล์
          curl -X PUT -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://api.github.com/repos/$REPO_OWNER/$REPO_NAME/contents/$FILE_PATH"