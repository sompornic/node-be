name: Dev zone Build

on:
  push:   
    branches:
      - develop  # Trigger workflow เมื่อ push บน branch develop


env:
  APP_NAME: node-be
  APP_ENV: "dev"
  CONTAINER_REPOSITORY: "ghcr.io"
  OWNER_NAME: "sompornic"
  IMAGE_TAG: "dev1.0.${{ github.run_number }}"
  GIT_BRANCH: "develop"

jobs:
  build-and-push:
    name: Build
    runs-on: ubuntu-latest
    environment: develop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          ref: develop   

      - name: "GHCR login"
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v1   
        with:
          registry: ${{ env.CONTAINER_REPOSITORY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PAT_TOKEN }}

      - name: Build and push image   
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/build-push-action@v2
        with:
          build-args: |
            "ENV=${{ env.APP_ENV }}"
          context: .
          push: true
          tags: ${{ env.CONTAINER_REPOSITORY }}/${{ env.OWNER_NAME }}/${{ env.APP_NAME }}:${{env.IMAGE_TAG}}

      - name: Repository Dispatch   
        if: ${{ github.event_name != 'pull_request' }}
        uses: peter-evans/repository-dispatch@v1
        with:
          token: ${{ secrets.PAT_TOKEN }}
          repository: sompornic/actionCD
          event-type: push-deploy
          client-payload: |
            {
              "ref": "${{ github.ref }}",
              "sha": "${{ github.sha }}",
              "inputs": {
                "repo": {    
                  "APP_NAME": "${{ env.APP_NAME }}",
                  "APP_ENV": "${{ env.APP_ENV }}",  
                  "IMAGE_TAG": "${{ env.IMAGE_TAG }}"
                }
              }
            }   