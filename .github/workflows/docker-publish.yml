name: Build and Deploy to Kubernetes

on:
  push:   
    branches:
      - develop  # Trigger workflow เมื่อ push บน branch develop

env:
  IMAGE_TAG: "dev1.0.${{ github.run_number }}"
  GH_TOKEN: ${{ secrets.PAT_TOKEN }}   # ใช้ PAT Token ที่มีสิทธิ์ push
  REPO_OWNER: "sompornic"   # เปลี่ยนเป็น owner ของ repo เป้าหมาย
  REPO_NAME: "helm-app"  # ชื่อ repo เป้าหมาย
  FILE_PATH: "app1/values.yaml" # ไฟล์ที่ต้องการแก้ไข
  BRANCH: "main"  # Branch ที่ต้องการ push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}  
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_ACCOUT }}/my-app:$IMAGE_TAG -f ./Dockerfile .
          docker push ${{ secrets.DOCKER_ACCOUT }}/my-app:$IMAGE_TAG

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Update Helm values.yaml via GitHub API
        run: |
          RESPONSE=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/$REPO_OWNER/$REPO_NAME/contents/$FILE_PATH")

          FILE_SHA=$(echo "$RESPONSE" | jq -r '.sha')
          FILE_CONTENT=$(echo "$RESPONSE" | jq -r '.content' | base64 -d)
          UPDATED_CONTENT=$(echo "$FILE_CONTENT" | sed "s|tag: .*|tag: $IMAGE_TAG|")
          ENCODED_CONTENT=$(echo "$UPDATED_CONTENT" | base64 -w 0)

          PAYLOAD=$(jq -n \
            --arg path "$FILE_PATH" \
            --arg message "Update image.tag to $IMAGE_TAG" \
            --arg content "$ENCODED_CONTENT" \
            --arg sha "$FILE_SHA" \
            '{ path: $path, message: $message, content: $content, sha: $sha }')

          curl -X PUT -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://api.github.com/repos/$REPO_OWNER/$REPO_NAME/contents/$FILE_PATH"

      - name: Trigger Helm Deployment
        run: |
          curl -X POST -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            -d '{"event_type": "deploy", "client_payload": {"zone": "dev"}}' \
            "https://api.github.com/repos/$REPO_OWNER/$REPO_NAME/dispatches"
