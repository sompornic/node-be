name: Build and Push Docker Image

on:
  push:
    branches:
      - develop  # Trigger workflow เมื่อมีการ push บน branch main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Login to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}  # ใช้ Secret สำหรับ username
          password: ${{ secrets.DOCKER_PASSWORD }}  # ใช้ Secret สำหรับ password

      # Step 3: Build Docker image
      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_ACCOUT }}/my-app:v1.0.3 -f ./Dockerfile .

      # Step 4: Push Docker image
      - name: Push Docker image
        run: | 
          docker push ${{ secrets.DOCKER_ACCOUT }}/my-app:v1.0.3
