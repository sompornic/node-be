apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  labels:
    app: my-app
spec:
  replicas: 0
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name: my-app
        image: sompornic/my-app:latest # เปลี่ยนเป็นชื่อภาพของคุณ
        ports:
        - containerPort: 3000
