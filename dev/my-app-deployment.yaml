apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  labels:
    app: my-app
  annotations:
    argocd-image-updater.argoproj.io/image-list: sompornic/my-app
    argocd-image-updater.argoproj.io/myapp.update-strategy: latest
spec:
  replicas: 3
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name: my-app
        image: sompornic/my-app:latest
        ports:
        - containerPort: 3000
        
